<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="1060" height="760" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<style>
  :root{
    --bg:#ffffff; --fg:#1f2328; --muted:#636c76; --box:#f6f8fa; --line:#d0d7de;
    --blue:#0969da; --blue-bg:#ddf4ff; --green:#1a7f37; --green-bg:#dafbe1;
    --amber:#9a6700; --amber-bg:#fff8c5; --red:#cf222e; --red-bg:#ffebe9;
    --band:#f6f8fa;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --box:#161b22; --line:#30363d;
      --blue:#4493f8; --blue-bg:#121d2f; --green:#3fb950; --green-bg:#0f2417;
      --amber:#d29922; --amber-bg:#272115; --red:#ff7b72; --red-bg:#25171c;
      --band:#11161d;
    }
  }
  .bg{fill:var(--bg)} .band{fill:var(--band)}
  .box{fill:var(--box);stroke:var(--line);stroke-width:1.5;rx:8}
  .t{fill:var(--fg);font-size:13.5px}
  .tb{fill:var(--fg);font-size:15px;font-weight:700}
  .tm{fill:var(--muted);font-size:12px}
  .title{fill:var(--fg);font-size:21px;font-weight:700}
  .sub{fill:var(--muted);font-size:13px}
  .bandlbl{fill:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:1.2px}
  .arr{stroke:var(--line);stroke-width:2;fill:none;marker-end:url(#a)}
  .arrb{stroke:var(--blue);stroke-width:2.2;fill:none;marker-end:url(#ab)}
  .lbl{fill:var(--fg);font-size:12px}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:var(--fg)}
  .codem{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:var(--muted)}
  .hdr{fill:var(--fg);font-size:12.5px;font-weight:700}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--line)"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--blue)"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1060" height="760"/>

<text class="title" x="30" y="38">Vòng đời hội thoại — ai được nói</text>
<text class="sub" x="30" y="60">Trạng thái quyết định quyền nói. Đây là bất biến quan trọng nhất của cả module.</text>

<!-- states -->
<rect class="box" x="60" y="110" width="190" height="92" stroke="var(--green)" fill="var(--green-bg)"/>
<text class="tb" x="80" y="140" fill="var(--green)">bot</text>
<text class="t" x="80" y="164">AI trả lời</text>
<text class="tm" x="80" y="186">trạng thái khởi đầu</text>

<rect class="box" x="420" y="110" width="190" height="92" stroke="var(--amber)" fill="var(--amber-bg)"/>
<text class="tb" x="440" y="140" fill="var(--amber)">waiting</text>
<text class="t" x="440" y="164">Chỉ thông báo chờ</text>
<text class="tm" x="440" y="186">AI đã im</text>

<rect class="box" x="780" y="110" width="190" height="92" stroke="var(--blue)" fill="var(--blue-bg)"/>
<text class="tb" x="800" y="140" fill="var(--blue)">human</text>
<text class="t" x="800" y="164">Thành viên đã nhận</text>
<text class="tm" x="800" y="186">AI vẫn im</text>

<rect class="box" x="420" y="320" width="190" height="78"/>
<text class="tb" x="440" y="350">closed</text>
<text class="tm" x="440" y="374">hết hạn, hoặc khách đóng</text>

<!-- transitions -->
<path class="arrb" d="M250 142 H 414"/>
<text class="lbl" x="268" y="134">khách xin gặp người,</text>
<text class="lbl" x="268" y="150">hoặc bot tự thấy nên chuyển</text>

<path class="arrb" d="M610 142 H 774"/>
<text class="lbl" x="640" y="134">một thành viên NHẬN</text>
<text class="codem" x="640" y="152">409 cho người bấm sau</text>

<path class="arr" d="M875 202 C 875 262 155 262 155 208"/>
<text class="lbl" x="470" y="256">thành viên trả lại cho bot</text>

<path class="arr" d="M155 202 C 155 300 410 300 414 340"/>
<path class="arr" d="M515 202 V 314"/>
<path class="arr" d="M875 202 C 875 330 620 350 616 356"/>
<text class="tm" x="300" y="412">từ bất kỳ trạng thái nào</text>

<!-- the invariant -->
<rect class="band" x="30" y="440" width="1000" height="150" rx="10"/>
<rect class="box" x="48" y="456" width="964" height="118" stroke="var(--red)" fill="var(--red-bg)"/>
<text class="tb" x="70" y="486" fill="var(--red)">Bất biến: khi state ≠ bot, AI không được sinh thêm một chữ nào</text>
<text class="t" x="70" y="514">Kiểm tra phải nằm ở <tspan class="code">thời điểm phát từng đoạn stream</tspan>, không chỉ ở lúc bắt đầu sinh.</text>
<text class="tm" x="70" y="540">Một lượt trả lời mất vài giây. Nếu chỉ kiểm lúc bắt đầu, thành viên nhận máy giữa chừng thì bot vẫn</text>
<text class="tm" x="70" y="558">nói nốt — khách thấy hai người cùng trả lời. Đây là lỗi kinh điển nhất của loại hệ thống này.</text>

<!-- table -->
<rect class="box" x="48" y="614" width="964" height="116"/>
<line x1="48" y1="650" x2="1012" y2="650" stroke="var(--line)"/>
<line x1="280" y1="614" x2="280" y2="730" stroke="var(--line)"/>
<line x1="540" y1="614" x2="540" y2="730" stroke="var(--line)"/>
<line x1="780" y1="614" x2="780" y2="730" stroke="var(--line)"/>
<text class="hdr" x="68" y="638">Trạng thái</text>
<text class="hdr" x="300" y="638">AI sinh câu trả lời?</text>
<text class="hdr" x="560" y="638">Người thật nói được?</text>
<text class="hdr" x="800" y="638">Khách gửi được?</text>

<text class="code" x="68" y="676">bot</text>
<text class="t" x="300" y="676" fill="var(--green)">có</text>
<text class="t" x="560" y="676">không</text>
<text class="t" x="800" y="676" fill="var(--green)">có</text>

<text class="code" x="68" y="700">waiting</text>
<text class="t" x="300" y="700" fill="var(--red)">KHÔNG</text>
<text class="t" x="560" y="700">chưa ai nhận</text>
<text class="t" x="800" y="700" fill="var(--green)">có</text>

<text class="code" x="68" y="724">human</text>
<text class="t" x="300" y="724" fill="var(--red)">KHÔNG</text>
<text class="t" x="560" y="724" fill="var(--green)">có</text>
<text class="t" x="800" y="724" fill="var(--green)">có</text>
</svg>

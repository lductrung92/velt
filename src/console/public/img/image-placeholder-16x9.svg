<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="No image">
  <!-- Translucent neutral, not an opaque panel: the console's dark mode is a
       class on <html>, which an <img>-loaded SVG cannot see, so the host page
       background has to show through for the slot to fit either theme.
       No picture glyph: an empty slot already centres an upload button, and
       drawing a second mark underneath it put two symbols in one spot. -->
  <rect width="1280" height="720" fill="#6b7280" fill-opacity="0.12"/>
</svg>
